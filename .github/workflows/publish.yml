name: Publish CLI to npm

on:
  push:
    tags:
      - "cli-v*"

jobs:
  publish:
    # npm trusted publishing (OIDC) only supports GitHub-hosted runners
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Publish
        # OIDC via trusted publisher on npmjs.com — no token; provenance is automatic
        run: npm publish --access public
